<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>查询信息</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    min-height: 100vh;
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .header {
    width: 100%;
    height: 92px;
    background: #2b3e6b;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 20px;
  }
  .header h1 {
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .content {
    padding: 56px 20px 40px 20px;
  }
  .result-header {
    background: #eef1f5;
    text-align: center;
    padding: 16px 0;
    border: 1px solid #d4dae3;
    border-bottom: none;
  }
  .result-header span {
    display: inline-block;
    background: #fff;
    padding: 5px 12px;
    font-size: 20px;
    font-weight: 600;
    color: #222;
  }
  .table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid #d4dae3;
  }
  .table tr {
    border-bottom: 1px solid #d4dae3;
  }
  .table tr:last-child {
    border-bottom: none;
  }
  .table td {
    padding: 16px 14px;
    font-size: 17px;
    color: #333;
    line-height: 1.5;
    vertical-align: middle;
  }
  .table td.label {
    width: 32%;
    border-right: 1px solid #d4dae3;
    color: #333;
    font-weight: 400;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>查询信息</h1>
  </div>
  <div class="content">
    <div class="result-header">
      <span>查询结果如下：</span>
    </div>
    <table class="table">
      <tr>
        <td class="label">证书单位</td>
        <td>中冶武勘工程技术有限公司</td>
      </tr>
      <tr>
        <td class="label">检测日期</td>
        <td>2025-12-08</td>
      </tr>
      <tr>
        <td class="label">有效日期</td>
        <td>2026-12-07</td>
      </tr>
      <tr>
        <td class="label">检测结果</td>
        <td>合格</td>
      </tr>
      <tr>
        <td class="label">其他</td>
        <td>/</td>
      </tr>
      <tr>
        <td class="label">检测机构</td>
        <td>北京市计量检测科学研究院</td>
      </tr>
    </table>
  </div>
</body>
</html>
