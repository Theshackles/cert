<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>查询信息</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    min-height: 100vh;
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 顶部导航栏 */
  .header {
    width: 100%;
    height: 88px;
    background: #2b3e6b;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 14px;
    position: relative;
  }
  .header h1 {
    color: #fff;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  /* 右上角胶囊按钮装饰 */
  .header .capsule {
    position: absolute;
    top: 36px;
    right: 12px;
    width: 88px;
    height: 32px;
    background: rgba(0,0,0,0.35);
    border-radius: 16px;
  }

  /* 内容区 */
  .content {
    padding: 40px 20px 0 20px;
  }

  /* 表格 */
  .table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid #d4dae3;
  }
  .table tr {
    border-bottom: 1px solid #d4dae3;
  }
  .table tr:last-child {
    border-bottom: none;
  }
  .table td {
    padding: 16px 14px;
    font-size: 17px;
    color: #333;
    line-height: 1.5;
    vertical-align: middle;
  }
  .table td.label {
    width: 32%;
    border-right: 1px solid #d4dae3;
    color: #333;
    font-weight: 400;
  }

  /* 查询结果如下 标题行 */
  .result-header {
    background: #eef1f5;
    text-align: center;
    padding: 14px 0;
    border: 1px solid #d4dae3;
    border-bottom: none;
  }
  .result-header span {
    display: inline-block;
    background: #fff;
    padding: 4px 10px;
    font-size: 20px;
    font-weight: 600;
    color: #222;
  }

  /* 底部更多 */
  .footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    padding: 16px 0 24px 0;
    background: #fff;
    border-top: 1px solid #eee;
    color: #666;
    font-size: 17px;
  }
  .footer .icon {
    display: inline-block;
    margin-right: 6px;
    font-size: 18px;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="capsule"></div>
    <h1>查询信息</h1>
  </div>

  <div class="content">
    <div class="result-header">
      <span>查询结果如下：</span>
    </div>
    <table class="table">
      <tr>
        <td class="label">证书单位</td>
        <td>中冶武勘工程技术有限公司</td>
      </tr>
      <tr>
        <td class="label">检测日期</td>
        <td>2024-05-25</td>
      </tr>
      <tr>
        <td class="label">有效日期</td>
        <td>2025-05-24</td>
      </tr>
      <tr>
        <td class="label">检测结果</td>
        <td>合格</td>
      </tr>
      <tr>
        <td class="label">其他</td>
        <td>/</td>
      </tr>
      <tr>
        <td class="label">检测机构</td>
        <td>北京市计量检测科学研究院</td>
      </tr>
    </table>
  </div>

  <div class="footer">
    <span class="icon">&#9776;</span> 更多
  </div>
</body>
</html>
