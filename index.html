<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>查询信息</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    min-height: 100vh;
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 顶部导航栏 - 模拟微信小程序导航栏 */
  .header {
    width: 100%;
    height: 92px;
    background: #2b3e6b;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding-top: 20px;
  }
  .header h1 {
    color: #fff;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  /* 右上角微信小程序胶囊按钮 */
  .header .capsule {
    position: absolute;
    top: 28px;
    right: 14px;
    width: 87px;
    height: 32px;
    background: rgba(0,0,0,0.35);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    overflow: hidden;
  }
  .header .capsule .dots {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-left: 14px;
  }
  .header .capsule .dots span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #fff;
  }
  .header .capsule .divider {
    width: 1px;
    height: 16px;
    background: rgba(255,255,255,0.3);
  }
  .header .capsule .circle {
    width: 16px;
    height: 16px;
    border: 2px solid #fff;
    border-radius: 50%;
    margin-right: 14px;
    position: relative;
  }
  .header .capsule .circle::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #fff;
  }

  /* 内容区 */
  .content {
    padding: 56px 20px 0 20px;
  }

  /* 查询结果如下 标题行 */
  .result-header {
    background: #eef1f5;
    text-align: center;
    padding: 16px 0;
    border: 1px solid #d4dae3;
    border-bottom: none;
  }
  .result-header span {
    display: inline-block;
    background: #fff;
    padding: 5px 12px;
    font-size: 22px;
    font-weight: 600;
    color: #222;
  }

  /* 表格 */
  .table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid #d4dae3;
  }
  .table tr {
    border-bottom: 1px solid #d4dae3;
  }
  .table tr:last-child {
    border-bottom: none;
  }
  .table td {
    padding: 20px 16px;
    font-size: 19px;
    color: #333;
    line-height: 1.5;
    vertical-align: middle;
  }
  .table td.label {
    width: 32%;
    border-right: 1px solid #d4dae3;
    color: #333;
    font-weight: 400;
  }

  /* 底部更多 */
  .footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    padding: 16px 0 28px 0;
    background: #fff;
    border-top: 1px solid #eee;
    color: #666;
    font-size: 18px;
  }
  .footer .icon {
    display: inline-block;
    margin-right: 8px;
    font-size: 20px;
    vertical-align: middle;
  }
  .footer span {
    vertical-align: middle;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="capsule">
      <div class="dots">
        <span></span><span></span><span></span>
      </div>
      <div class="divider"></div>
      <div class="circle"></div>
    </div>
    <h1>查询信息</h1>
  </div>

  <div class="content">
    <div class="result-header">
      <span>查询结果如下：</span>
    </div>
    <table class="table">
      <tr>
        <td class="label">证书单位</td>
        <td>中冶武勘工程技术有限公司</td>
      </tr>
      <tr>
        <td class="label">检测日期</td>
        <td>2024-05-10</td>
      </tr>
      <tr>
        <td class="label">有效日期</td>
        <td>2025-05-09</td>
      </tr>
      <tr>
        <td class="label">检测结果</td>
        <td>合格</td>
      </tr>
      <tr>
        <td class="label">其他</td>
        <td>/</td>
      </tr>
      <tr>
        <td class="label">检测机构</td>
        <td>北京市计量检测科学研究院</td>
      </tr>
    </table>
  </div>

  <div class="footer">
    <span class="icon">&#9776;</span><span>更多</span>
  </div>
</body>
</html>
